{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Login | Creative Tech HRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        
        
        
        

       
        :root {
            --bg: #f8fafc;
            --bg-secondary: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.95);
            --border: rgba(15, 23, 42, 0.08);
            --border-hover: rgba(15, 23, 42, 0.15);
            
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --accent: #3b82f6;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            
            --success: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --warning: #f59e0b;
            --warning-bg: rgba(245, 158, 11, 0.1);
            --danger: #ef4444;
            --danger-bg: rgba(239, 68, 68, 0.1);
        }
body {
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(-45deg, #0a0f1e, #0d1b3e, #051030, #0a192f);
            background-size: 400% 400%;
            position: relative; overflow: hidden;
        }

        .orb { position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none; }
        .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, rgba(0,85,255,0.18), transparent); top: -150px; right: -100px; }
        .orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(249,115,22,0.1), transparent); bottom: -100px; left: -100px; }
        .orb-3 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(99,102,241,0.12), transparent); top: 50%; left: 50%; transform: translate(-50%,-50%); }

        .login-container {
            width: 100%; max-width: 440px; padding: 1rem;
            position: relative; z-index: 10;
        }

        .login-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 1.75rem;
            padding: 2.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .brand-badge {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background: rgba(0,85,255,0.15); border: 1px solid rgba(0,85,255,0.3);
            border-radius: 9999px; padding: 0.35rem 1rem; margin-bottom: 1.5rem;
            font-size: 0.75rem; font-weight: 700; color: var(--primary-hover);
            letter-spacing: 0.05em; text-transform: uppercase;
        }
        .brand-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); }

        h1 { font-size: 2rem; font-weight: 900; color: var(--card-bg); margin-bottom: 0.4rem; letter-spacing: -0.03em; }
        .subtitle { color: rgba(255,255,255,0.5); font-size: 0.9rem; margin-bottom: 2rem; }

        .form-group { margin-bottom: 1.1rem; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: rgba(255,255,255,0.55); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.06em; }
        input {
            width: 100%; padding: 0.8rem 1rem;
            background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 0.75rem; font-size: 0.9rem; color: var(--card-bg);
            transition: all 0.25s;
        }
        input::placeholder { color: rgba(255,255,255,0.25); }
        input:focus { outline: none; border-color: var(--primary); background: rgba(0,85,255,0.08); box-shadow: 0 0 0 4px rgba(0,85,255,0.15); }

        .btn-login {
            width: 100%; padding: 0.85rem;
            background: linear-gradient(135deg, var(--primary), #3377ff);
            background-size: 200% 200%;
            color: var(--card-bg); border: none; border-radius: 0.85rem;
            font-size: 0.95rem; font-weight: 800; cursor: pointer;
            margin-top: 0.5rem; transition: all 0.25s;
            box-shadow: var(--shadow-md);
            position: relative; overflow: hidden;
        }
        .btn-login::after { content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent); transform:translateX(-100%); transition:transform 0.4s; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,85,255,0.5); }
        .btn-login:hover::after { transform: translateX(100%); }

        .alert { padding: 0.75rem 1rem; border-radius: 0.65rem; font-size: 0.85rem; font-weight: 500; margin-bottom: 1rem; }
        .alert-error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
        .alert-success { background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); color: #6ee7b7; }

        .footer-links { margin-top: 1.75rem; text-align: center; }
        .footer-links a { color: rgba(255,255,255,0.35); font-size: 0.8rem; text-decoration: none; transition: color 0.2s; }
        .footer-links a:hover { color: var(--primary-hover); }

        .divider { border: 0; border-top: 1px solid rgba(255,255,255,0.08); margin: 1.5rem 0; }

        .icon-wrap {
            width: 60px; height: 60px; border-radius: 1.1rem;
            background: linear-gradient(135deg, rgba(0,85,255,0.2), rgba(0,85,255,0.05));
            border: 1px solid rgba(0,85,255,0.3);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.75rem; margin-bottom: 1.25rem;
        }
    
        /* RESPONSIVE DESIGN */
        @media (max-width: 480px) {
            .login-card {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .orb-1 { width: 300px; height: 300px; }
            .orb-2 { width: 250px; height: 250px; }
        }
</style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="brand-badge"><span class="brand-dot"></span>Client Portal</div>
            <div class="icon-wrap">🤝</div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to view your projects and track progress</p>

            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
            {% endif %}

            <form method="post" id="client-login-form">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" placeholder="your.username" id="id_username" required autofocus>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="••••••••" id="id_password" required>
                </div>
                <button type="submit" class="btn-login" id="login-btn">Sign In to Portal</button>
            </form>

            <hr class="divider">
            <div class="footer-links">
                <a href="{% url 'admin_login' %}">Admin Login</a>
                &nbsp;&bull;&nbsp;
                <a href="{% url 'employee_login' %}">Employee Login</a>
            </div>
        </div>
    </div>
</body>
</html>
